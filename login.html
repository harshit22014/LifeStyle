<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lifestyle Hub - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">

            <div class="logo">
                Lifestyle<span>Hub</span>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="fashion.html">Fashion</a>
                </li>


                <li>
                    <a href="food.html">Food</a>
                </li>

                <li>
                    <a href="travel.html">Travel</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

                <li>
                    <a href="login.html" class="active">Login</a>
                </li>
            </ul>

        </nav>
    </header>


    

    <section class="login-section">

        <div class="login-box">

            <div class="login-heading">

                <div class="login-icon">
                    👤
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your Lifestyle Hub account
                </p>

            </div>


            <form>

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="signup-text">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>


            <a
                href="index.html"
                class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            Lifestyle<span>Hub</span>
        </div>

        <p>
            © 2026 Lifestyle Hub. All Rights Reserved.
        </p>

        <div class="social">

            <a href="#">Instagram</a>

            <a href="#">Facebook</a>

            <a href="#">Twitter</a>

        </div>

    </footer>

</body>

</html>
